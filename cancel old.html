<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Cancelled – Staviox</title>
  <link rel="icon" type="image/png" href="/icons/icon48.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f12; --card: #1e1e28; --border: #2a2a38;
      --blue: #0078d4; --blue-lt: #4dabf7; --text: #e8e8f0;
      --muted: #888898; --white: #ffffff;
      --font: 'Segoe UI', system-ui, sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 56px 48px; max-width: 440px; width: 100%; text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 24px; }
    h1 { font-size: 26px; font-weight: 800; color: var(--white); letter-spacing: -0.02em; margin-bottom: 12px; }
    p { font-size: 15px; color: var(--muted); line-height: 1.7; margin-bottom: 28px; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 24px; border-radius: 9px; font-weight: 600; font-size: 15px;
      cursor: pointer; border: none; text-decoration: none !important;
      transition: all 0.2s ease; font-family: var(--font);
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: #1483d8; transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: rgba(255,255,255,0.04); }
    .note { font-size: 13px; color: var(--muted); margin-top: 20px; }
    .note a { color: var(--blue-lt); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">↩️</div>
    <h1>No problem!</h1>
    <p>Your checkout was cancelled and you have not been charged. You can upgrade anytime from the extension.</p>
    <div class="actions">
      <a href="/email-contact-analyzer/upgrade" class="btn btn-primary">Back to Pricing</a>
      <a href="/email-contact-analyzer" class="btn btn-ghost">Product Page</a>
    </div>
    <p class="note">Questions? <a href="mailto:support@staviox.com">support@staviox.com</a></p>
  </div>
</body>
</html>
